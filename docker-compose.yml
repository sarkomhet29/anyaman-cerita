# Jalankan PostgreSQL lokal di laptop/CasaOS kamu.
# Bisa juga ditambahkan lewat CasaOS App Store, tapi ini alternatif via CLI:
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: gantidenganpasswordkuat
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
